# Theme aligned with PathBank magenta public chrome (src/t2pw/web/static/css/site.css).
# secondaryBackgroundColor is a neutral gray (not cream) so default hovers are not yellow.
[theme]
primaryColor = "#9d4485"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f4f6"
textColor = "#18212b"
font = "sans serif"

[client]
# Top nav is provided by custom chrome in t2pw_ui.py (st.navigation position=hidden).
showSidebarNavigation = false
