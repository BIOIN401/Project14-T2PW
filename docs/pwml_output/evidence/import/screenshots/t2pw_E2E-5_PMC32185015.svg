      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#BBB" stroke-width="1"></path>
  </pattern>
  <filter id="greyscale">
    <feColorMatrix type="matrix" values="0.3333 0.3333 0.3333 0 0
    0.3333 0.3333 0.3333 0 0
    0.3333 0.3333 0.3333 0 0
    0 0 0 1 0"></feColorMatrix>
  </filter>
  <filter id="outline" color-interpolation-filters="sRGB" x="-5%" y="-5%" width="110%" height="110%">
    <feColorMatrix type="matrix" in="SourceGraphic" result="gray" values="0.2 0.2 0.2 0 0
      0.2 0.2 0.2 0 0
      0.2 0.2 0.2 0 0
      0 0 0 1 0"></feColorMatrix>
    <feMorphology operator="dilate" radius="1" in="gray" result="dilated"></feMorphology>
    <feMorphology operator="erode" radius="1" in="gray" result="eroded"></feMorphology>
    <feBlend in="dilated" in2="eroded" mode="difference" result="edgeMag"></feBlend>
    <feComponentTransfer in="edgeMag" result="lines">
      <feFuncR type="linear" slope="-2" intercept="1"></feFuncR>
      <feFuncG type="linear" slope="-2" intercept="1"></feFuncG>
      <feFuncB type="linear" slope="-2" intercept="1"></feFuncB>
      <feFuncA type="identity"></feFuncA>
    </feComponentTransfer>
    <feComposite in="lines" in2="SourceAlpha" operator="in"></feComposite>
  </filter>
