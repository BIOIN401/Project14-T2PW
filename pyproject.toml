[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "t2pw"
version = "0.1.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"t2pw.web" = ["templates/*.html", "templates/macros/*.html", "static/css/*.css", "static/js/*.js"]
"t2pw.vision" = ["prompts/*"]
"t2pw.render" = ["pathbank_art/*.png", "pathbank_art/catalog.json"]
"t2pw.vision.diagram" = ["diagram.css", "fonts/*"]
